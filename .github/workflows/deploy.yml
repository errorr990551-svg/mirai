name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🎉 Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build Frontend & Prerender SEO Pages
        working-directory: frontend
        run: npm run build

      - name: 🧹 Prepare Clean FTP Server Address
        id: ftp_config
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          RAW_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -E 's|^[a-zA-Z]+://||' | sed 's|/.*||' | tr -d '[:space:]')
          CLEAN_USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          echo "clean_server=$CLEAN_SERVER" >> $GITHUB_OUTPUT
          echo "clean_user=$CLEAN_USER" >> $GITHUB_OUTPUT

      - name: 📦 Package Build for High-Speed Deployment
        id: package
        run: |
          # Generate secure random token
          DEPLOY_TOKEN=$(openssl rand -hex 16)
          echo "deploy_token=$DEPLOY_TOKEN" >> $GITHUB_OUTPUT

          # Create deploy staging folder
          mkdir -p deploy_staging

          # Bundle all 8,000+ files and dotfiles (.htaccess) into a single zip
          echo "Creating deploy_payload.zip from frontend/dist..."
          cd frontend/dist
          zip -r -q ../../deploy_staging/deploy_payload.zip .
          cd ../..

          echo "Zip size: $(du -h deploy_staging/deploy_payload.zip | cut -f1)"

          # Create one-time secure extraction script
          cat << 'EOF' > deploy_staging/deploy_extract.php
<?php
error_reporting(E_ALL);
ini_set('display_errors', 0);
ini_set('memory_limit', '512M');
set_time_limit(300);
ignore_user_abort(true);

header('Content-Type: text/plain; charset=utf-8');

$expected_token = '%%DEPLOY_TOKEN%%';
$provided_token = isset($_GET['token']) ? (string)$_GET['token'] : '';

if (empty($expected_token) || !hash_equals($expected_token, $provided_token)) {
    http_response_code(403);
    echo "ERROR: Unauthorized access.";
    exit;
}

$zip_file = __DIR__ . '/deploy_payload.zip';

if (!file_exists($zip_file)) {
    http_response_code(404);
    echo "ERROR: deploy_payload.zip not found on server.";
    exit;
}

if (!class_exists('ZipArchive')) {
    http_response_code(500);
    echo "ERROR: PHP ZipArchive extension is not available.";
    exit;
}

$zip = new ZipArchive();
$res = $zip->open($zip_file);

if ($res !== TRUE) {
    http_response_code(500);
    echo "ERROR: Unable to open zip file (Code: $res).";
    exit;
}

$extracted = $zip->extractTo(__DIR__);
$zip->close();

if (!$extracted) {
    http_response_code(500);
    echo "ERROR: Failed to extract files.";
    exit;
}

// Self-destruct temporary deploy files
@unlink($zip_file);
@unlink(__FILE__);

echo "DEPLOY_SUCCESS: All files extracted and cleaned up successfully.";
EOF

          # Inject the one-time token into the PHP script
          sed -i "s/%%DEPLOY_TOKEN%%/$DEPLOY_TOKEN/g" deploy_staging/deploy_extract.php
          echo "Extraction script prepared."

      - name: 🚀 Upload Fast Package via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_config.outputs.clean_server }}
          username: ${{ steps.ftp_config.outputs.clean_user }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: ./deploy_staging/
          dangerous-clean-slate: false

      - name: ⚡ Extract Package on Hostinger Server
        run: |
          echo "Waiting 3 seconds for FTP sync..."
          sleep 3
          echo "Triggering extraction on Hostinger server..."
          RESPONSE=$(curl -s -S -k -L -A "Mozilla/5.0 (GitHubActions CI/CD)" --retry 4 --retry-delay 3 --max-time 180 "https://miraitechnologies.net/deploy_extract.php?token=${{ steps.package.outputs.deploy_token }}")
          echo "Server Response: $RESPONSE"
          if [[ "$RESPONSE" == *"DEPLOY_SUCCESS"* ]]; then
            echo "🎉 Site deployed and extracted successfully on Hostinger!"
          else
            echo "❌ Extraction failed. Please verify server response above."
            exit 1
          fi
