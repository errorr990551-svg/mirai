name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🎉 Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build Frontend & Prerender SEO Pages
        working-directory: frontend
        run: npm run build

      - name: 🧹 Prepare Clean FTP Server Address
        id: ftp_config
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          RAW_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -E 's|^[a-zA-Z]+://||' | sed 's|/.*||' | tr -d '[:space:]')
          CLEAN_USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          echo "clean_server=$CLEAN_SERVER" >> $GITHUB_OUTPUT
          echo "clean_user=$CLEAN_USER" >> $GITHUB_OUTPUT

      - name: 🚀 Deploy to Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_config.outputs.clean_server }}
          username: ${{ steps.ftp_config.outputs.clean_user }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: public_html/
          local-dir: ./frontend/dist/
