name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: 🎉 Build & Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🏗️ Build Frontend & Prerender SEO Pages
        working-directory: frontend
        run: npm run build

      - name: 🧹 Prepare Clean FTP Server Address
        id: ftp_config
        env:
          RAW_SERVER: ${{ secrets.FTP_SERVER }}
          RAW_USER: ${{ secrets.FTP_USERNAME }}
        run: |
          CLEAN_SERVER=$(echo "$RAW_SERVER" | sed -E 's|^[a-zA-Z]+://||' | sed 's|/.*||' | tr -d '[:space:]')
          CLEAN_USER=$(echo "$RAW_USER" | tr -d '[:space:]')
          echo "clean_server=$CLEAN_SERVER" >> $GITHUB_OUTPUT
          echo "clean_user=$CLEAN_USER" >> $GITHUB_OUTPUT

      - name: 📦 Package Build for High-Speed Deployment
        id: package
        run: |
          DEPLOY_TOKEN=$(openssl rand -hex 16)
          echo "deploy_token=$DEPLOY_TOKEN" >> $GITHUB_OUTPUT

          mkdir -p deploy_staging

          echo "Creating deploy_payload.zip from frontend/dist..."
          cd frontend/dist
          zip -r -q ../../deploy_staging/deploy_payload.zip .
          cd ../..

          echo "Zip size: $(du -h deploy_staging/deploy_payload.zip | cut -f1)"

          # Generate extraction script from template with secure one-time token
          sed "s/%%DEPLOY_TOKEN%%/$DEPLOY_TOKEN/g" .github/scripts/deploy_extract.template.php > deploy_staging/deploy_extract.php
          echo "Extraction script prepared."

      - name: 🚀 Upload Fast Package via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp_config.outputs.clean_server }}
          username: ${{ steps.ftp_config.outputs.clean_user }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          local-dir: ./deploy_staging/
          dangerous-clean-slate: false

      - name: ⚡ Extract Package on Hostinger Server
        run: |
          echo "Waiting 3 seconds for FTP sync..."
          sleep 3
          echo "Triggering extraction on Hostinger server..."
          URL="https://miraitechnologies.net/deploy_extract.php?token=${{ steps.package.outputs.deploy_token }}"
          RESPONSE=$(curl -s -S -k -L -A "Mozilla/5.0 (GitHubActions CI/CD)" --retry 4 --retry-delay 3 --max-time 180 "$URL")
          echo "Server Response: $RESPONSE"

          # Fallback check in case FTP user was at parent root
          if [[ "$RESPONSE" != *"DEPLOY_SUCCESS"* ]]; then
            echo "Checking fallback nested public_html location..."
            FALLBACK_URL="https://miraitechnologies.net/public_html/deploy_extract.php?token=${{ steps.package.outputs.deploy_token }}"
            FALLBACK_RESP=$(curl -s -S -k -L -A "Mozilla/5.0 (GitHubActions CI/CD)" --max-time 180 "$FALLBACK_URL")
            echo "Fallback Response: $FALLBACK_RESP"
            if [[ "$FALLBACK_RESP" == *"DEPLOY_SUCCESS"* ]]; then
              RESPONSE="$FALLBACK_RESP"
            fi
          fi

          if [[ "$RESPONSE" == *"DEPLOY_SUCCESS"* ]]; then
            echo "🎉 Site deployed and extracted successfully on Hostinger!"
          else
            echo "❌ Extraction failed. Please verify server response above."
            exit 1
          fi
