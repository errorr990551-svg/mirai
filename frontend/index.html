    <style>
      /* Visually hide SEO content for search crawlers/accessibility only */
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      /* Premium Loading Screen Styles */
      .app-loading-screen {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #0f172a; /* Slate 900 background matching premium feel */
        z-index: 99999;
        font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
      }

      .loading-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: fadeIn 0.4s ease-out;
      }

      .loading-logo-container {
        display: flex;
        align-items: center;
        margin-bottom: 24px;
      }

      .loading-logo-icon {
        background-color: rgba(37, 99, 235, 0.15);
        padding: 10px;
        border-radius: 12px;
        margin-right: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(37, 99, 235, 0.3);
      }

      .zap-icon {
        width: 24px;
        height: 24px;
        color: #2563eb;
      }

      .loading-logo-text {
        font-size: 28px;
        font-weight: 700;
        letter-spacing: 0.025em;
        color: #2563eb;
      }

      .loading-bar-wrapper {
        width: 160px;
        height: 4px;
        background-color: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        overflow: hidden;
        margin-bottom: 12px;
      }

      .loading-bar-progress {
        width: 100%;
        height: 100%;
        background-color: #2563eb;
        border-radius: 2px;
        transform: translateX(-100%);
        animation: loadingProgress 1.5s infinite cubic-bezier(0.4, 0, 0.2, 1);
      }

      .loading-subtitle {
        font-size: 13px;
        color: #94a3b8; /* Slate 400 */
        font-weight: 500;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.95); }
        to { opacity: 1; transform: scale(1); }
      }

      @keyframes loadingProgress {
        0% {
          transform: translateX(-100%);
        }
        50% {
          transform: translateX(0%);
        }
        100% {
          transform: translateX(100%);
        }
      }
    </style>
